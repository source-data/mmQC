[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soda-mmqc"
version = "0.1.0"
description = "SODA MMQC: A tool for quality control of scientific figures"
authors = [
    {name = "SODA Team", email = "soda@example.com"},
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "langfuse>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "Pillow>=10.0.0",
    "nltk>=3.8.1",
    "torch>=2.0.0,<3",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "tqdm",
    "plotly>=5.13.0",
    # Static image export for plotly figures, so a paper figure can be
    # written from a notebook. plotly 6.5 declares kaleido>=1.1.0 for
    # its own `kaleido` extra; v1 drives a real browser rather than
    # bundling one, so `write_image` needs Chrome available.
    "kaleido>=1.1.0",
    "pandas>=1.3.0",
    "streamlit>=1.34.0",
    "streamlit-image-zoom>=0.0.4",
    "matplotlib",
    "accelerate>=0.27.0",
    "watchdog>=3.0.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "python-docx>=0.8.11",
    "pytest>=7.0.0",
    "openpyxl>=3.1.5",
    "mmqc-utils>=0.3.0",
    "rapidfuzz>=3.0.0",
    "itables>=2.0.0",
    # Agentic checklist runner. Accepted at human gate 4A (2026-09-14),
    # confirmed against https://code.claude.com/docs/en/agent-sdk/python
    #
    # Pinned exactly rather than floated: the SDK is 0.x with no semver
    # promise and ships frequently, and a silently updated agent runtime
    # would make scores non-comparable between runs -- the one property
    # milestones 5 and 6 depend on. Bumping it is a deliberate change.
    "claude-agent-sdk==0.2.152",
]

[project.scripts]
# One CLI. `evaluate` and `init` used to point into scripts/run.py, so a
# command could be declared in two places; they are now `mmqc score` and
# `mmqc init`.
mmqc = "soda_mmqc.cli:main"
# Kept for muscle memory; each is also `mmqc <command>`, and each points at
# the same launcher, so there is still one implementation.
curate = "soda_mmqc.scripts.curate:main"
report = "soda_mmqc.scripts.report:main"
export-fig-report = "soda_mmqc.scripts.export_fig_checklist_report:main"

[tool.hatch.build.targets.wheel]
packages = ["soda_mmqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Live tests are opt-in: they spend money, and "a key happens to be present"
# is a poor proxy for "I meant to spend money right now" -- CI environments
# tend to have keys. Run them with: pytest -m integration
addopts = "-v -m 'not integration'"
markers = [
    "integration: calls a real provider API; opt-in, gated on its own provider's key (see tests/conftest.py)",
] 
