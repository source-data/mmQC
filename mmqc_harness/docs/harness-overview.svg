<svg xmlns="http://www.w3.org/2000/svg" width="960" height="664" viewBox="0 0 960 664" role="img" aria-label="mmqc-harness: mmQC publishes a production checklist to Langfuse; an application pulls a verified local copy with mmqc-skills; per figure, the figure is converted once, a throwaway runtime holds the closure of skills and a sealed agent session with only the Skill tool, and run_session returns the validated answer, the skill trace and an audit with cost and image fingerprints; the runtime is then deleted">
