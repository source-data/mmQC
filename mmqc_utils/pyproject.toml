[project]
name = "mmqc-utils"
version = "0.3.5"
description = "Reusable conversion utilities for images, documents, text, and related data types."
readme = "README.md"
authors = [
  {name = "Thomas Eidens", email = "thomas.eidens@embo.org"}
]
maintainers = [
  {name = "Thomas Eidens", email = "thomas.eidens@embo.org"}
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = "Apache-2.0"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "imagecodecs>=2026.6.6",
    "pillow>=12.2.0",
    "pypandoc-binary>=1.17",
    "pypdf>=6.10.2",
    "rapidfuzz>=3.14.3",
    "tifffile>=2026.6.1",
    "Wand>=0.6.13",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
test = [
    "coverage>=7.13.5",
    "ipdb>=0.13.13",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
]
publish = [
    "build>=1.5.0",
    "twine>=6.2.0",
]

[project.urls]
bugs = "https://github.com/source-data/mmQC/issues"
homepage = "https://github.com/source-data/mmQC"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmqc_utils = ["py.typed"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
