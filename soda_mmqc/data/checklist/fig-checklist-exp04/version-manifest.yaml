# Pinned skill versions for fig-checklist-exp04.
#
# Every skill in the checklist must appear here. A run assembles one
# version per skill; the agent never sees the alternatives.
#
# Copied 2026-10-04 from fig-checklist-exp03 as it stood, with exp-02's
# classify-panels v2 and identify-panels v1 added for the third arm. The
# contract cleanup's wording is then ported into new versions, one skill at a
# time (thinking/experiments/exp-04-panel-major.md, "How the skills are
# written"); these pins move to those versions as they land.
#
# `do-fig-checklist` is the entry point and the only leaf: it owns the one
# contract. Its schema.json and eval-manifest.json are exp-03's check-major
# contract, not yet cleaned; both contracts, check-major and panel-major, are
# derived from the cleaned fig-checklist contracts before the run (P6).
#
# The three arms, and how each is reached:
#
#   A|B|C_i <- D          these pins                                   (checks at v1)
#   A|B <- C_i <- D       --unpin the three checks -> v3               (classify-panels at v1)
#   A <- B <- C_i <- D    as above, and classify-panels -> v2          (calls identify-panels)
#
# where A is panel identification, B panel classification, C_i a check and D
# the entry skill. Each runs under both contract shapes.
#
# `identify-panels` is reached only in the third arm. exp-02 showed that its
# description alone drew calls in 5-12% of A|B <- C sessions; closure assembly
# keeps it out of the sessions of the other two arms.
skills:
  # Entry point. Owns schema.json, benchmark.json and eval-manifest.json.
  do-fig-checklist: v1

  # Shared skills. classify-panels is called by the checks at v3; at v2 it
  # calls identify-panels. Both idle when the checks are at v1.
  classify-panels: v1
  identify-panels: v1

  # Checks, called by do-fig-checklist through prose.
  error-bars-defined: v1
  individual-data-points: v1
  micrograph-scale-bar: v1
