# Pinned skill versions for fig-checklist-exp05.
#
# Every skill in the checklist must appear here. A run assembles one
# version per skill; the agent never sees the alternatives.
#
# Copied 2026-10-06 from fig-checklist-exp04 as it stood, which stays frozen.
# exp-05 adds the entry points at v2 (invoke classify-panels, then each check)
# and the checks at v4 (no classification step; they take the panel list as
# given), for the arrangement [A|B, {C_i}] <- D
# (thinking/experiments/exp-05-shared-step-first.md). These pins move to those
# versions as they land; until then they are exp-04's.
#
# Two entry points, the only leaves, one per contract shape:
# `do-fig-checklist-cm` (check-major: one list per check) and
# `do-fig-checklist-pm` (panel-major: one row per panel, each check's fields in
# an object inside it). Their prose is identical but for the name; each owns
# its schema.json, eval-manifest.json and benchmark.json, derived from the
# cleaned fig-checklist contracts by experiments/exp-04-panel-major/
# build_contract.py. Closure assembly gives a session the leaf it starts from
# and never the other.
#
# The three arms, and how each is reached:
#
#   A|B|C_i <- D          these pins                                   (checks at v1)
#   A|B <- C_i <- D       --unpin the three checks -> v3               (classify-panels at v1)
#   A <- B <- C_i <- D    as above, and classify-panels -> v2          (calls identify-panels)
#
# where A is panel identification, B panel classification, C_i a check and D
# the entry skill, -cm or -pm. Each runs under both contract shapes.
#
# `identify-panels` is reached only in the third arm. exp-02 showed that its
# description alone drew calls in 5-12% of A|B <- C sessions; closure assembly
# keeps it out of the sessions of the other two arms.
skills:
  # Entry points, one per contract shape. Each owns schema.json,
  # benchmark.json and eval-manifest.json.
  do-fig-checklist-cm: v1
  do-fig-checklist-pm: v1

  # Shared skills. classify-panels is called by the checks at v3; at v2 it
  # calls identify-panels. Both idle when the checks are at v1.
  classify-panels: v1
  identify-panels: v1

  # Checks, called by the entry point through prose.
  error-bars-defined: v1
  individual-data-points: v1
  micrograph-scale-bar: v1
