# Pinned skill versions for fig-checklist-exp01.
#
# Every skill in the checklist must appear here. A run assembles one
# version per skill; the agent never sees the alternatives.
#
# Compare versions with:  evaluate <checklist> --unpin <skill>
# which runs once per version of that skill with the rest at these
# pins. One skill at a time -- never a grid.
skills:
  error-bars-defined: v1
  image-annotation-defined: v1
  individual-data-points: v1
  micrograph-scale-bar: v1
  panel-image-matches-caption: v1
  plot-axis-units: v1
  plot-gap-labeling: v1
  replication-reporting: v1
  single-channel-for-overlay: v1
  stat-significance-level: v1
  stat-test: v1
