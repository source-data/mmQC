checklist: fig-checklist
skill_set: d3428c97d49ea71bad9476604b411457087480fd29b6770ffb9d1dd0e4cac523
skills:
- name: classify-plot-panels
  version: v1
  content_hash: 5bae9500527ac8a9ca22c2c9229dffdd233a1ffdad6d5520b3af82efa83d5aac
  kind: shared
  description: 'Describe what kind of plot each figure panel contains and what its
    axes are: the plot types observed, whether drawn axes are present, and for each
    axis its numeric or categorical scale, its tick labels verbatim, and its title.
    Use this whenever a task needs to know what a panel plots or how its axes are
    laid out. Reports observations only — it does not decide whether a panel counts
    as a quantitative plot for any particular check, because different checks answer
    that differently.'
  calls:
  - identify-panels
  produces:
  - plot_panels
- name: error-bars-defined
  version: v1
  content_hash: ff48887559b482d769b21880e68c2f01e6a78ca519409118fe5b905688add9d4
  kind: check
  description: Check that error bars and box-plot elements shown in a figure are defined
    in its caption. Use this for the error-bars-defined quality-control check. Decides,
    for each panel, whether error bars or box/whisker elements are present, whether
    the caption says what they represent, extracts that definition, and gives a PASS
    or FAIL verdict.
  calls:
  - classify-plot-panels
  - identify-panels
  produces:
  - error-bars-defined
- name: identify-panels
  version: v1
  content_hash: 7f5d1c2eb073aba72ed1f0a6aac94c28e86ea38ac2761890965bfe503e22476e
  kind: shared
  description: Identify every labeled panel of a scientific figure and map each panel
    to the caption text that describes it. Use this first, whenever a task needs the
    list of panels, their labels, where each panel sits in the figure image, what
    each panel shows, or which caption sentence applies to which panel. Produces the
    shared panels artifact. Makes no quality-control judgement about what a panel
    contains.
  calls: []
  produces:
  - panels
- name: image-annotation-defined
  version: v1
  content_hash: 6f4144d259c959a64c369c6e163304053f75ac9d98628a1f7aede71cb8935693
  kind: check
  description: Check that graphical annotations drawn on imaging panels — arrows,
    arrowheads, circles, boxes, dashed lines — are explained in the figure caption.
    Use this for the image-annotation-defined quality-control check. Decides, for
    each panel, whether it holds imaging data, lists each unique annotation by shape
    and colour, and extracts the caption text defining each one. Scale bars are excluded
    entirely.
  calls:
  - identify-panels
  produces:
  - image-annotation-defined
- name: individual-data-points
  version: v1
  content_hash: af650cb0f89850f6aa6585aa14102d3f01154ca7c6ed745500da697be4661cf8
  kind: check
  description: Check that plots which should show individual data points actually
    do. Use this for the individual-data-points quality-control check. Decides, for
    each panel, whether it is a plot, whether individual values are displayed or are
    not required for that plot type, and gives a PASS or FAIL verdict with an explanation.
  calls:
  - classify-plot-panels
  - identify-panels
  produces:
  - individual-data-points
- name: micrograph-scale-bar
  version: v1
  content_hash: 3e42f5c25152718de58d0ef12460cb1df5aac10c7c1bb1002883928ef7bd504e
  kind: check
  description: Check that every micrograph panel of a scientific figure carries a
    scale bar, and that the scale bar length is defined either on the image itself
    or in the figure caption. Use this for the micrograph-scale-bar quality-control
    check. Decides, for each panel, whether the panel is a micrograph, whether a scale
    bar is present on it, whether its length is written on the image or in the caption,
    and extracts that definition.
  calls:
  - identify-panels
  produces:
  - micrograph-scale-bar
- name: panel-image-matches-caption
  version: v1
  content_hash: ce11c419e3ae49b4590fe85e078aa532ba00b448d9a46b54c6fa59246057b000
  kind: check
  description: Judge whether what a panel's image actually shows contradicts what
    its caption claims is shown. Use this for the panel-image-matches-caption quality-control
    check. Returns a yes/no/not_applicable verdict per panel plus a description of
    any substantive discrepancy — wrong plot type, missing conditions, contradictory
    labels, or elements present in one and absent from the other. It does not identify
    panels and does not map caption text to panels; it compares content that has already
    been identified.
  calls:
  - identify-panels
  produces:
  - panel-image-matches-caption
- name: plot-axis-units
  version: v1
  content_hash: ebed6c31d8f1ba1cfefbced4cf9e546539d69a23b4d28b6d1d8d828cd177c0ad
  kind: check
  description: Check that the axes of quantitative plots carry the units of the quantity
    they measure. Use this for the plot-axis-units quality-control check. Decides,
    for each panel, whether it is a quantitative plot with axes, whether units are
    provided on each axis, extracts the unit definitions as printed, and gives a PASS
    or FAIL verdict.
  calls:
  - classify-plot-panels
  - identify-panels
  produces:
  - plot-axis-units
- name: plot-gap-labeling
  version: v1
  content_hash: a41c872352740af1fbe2c146b0fbee84afc8e977211be34b991221313de38fe5
  kind: check
  description: Check that discontinuities in a plot's axis are marked with a visible
    break indicator. Use this for the plot-gap-labeling quality-control check. Decides,
    for each panel, whether the tick label sequence jumps anomalously and, if so,
    whether the break is visually marked, and gives a PASS or FAIL verdict.
  calls:
  - classify-plot-panels
  - identify-panels
  produces:
  - plot-gap-labeling
- name: replication-reporting
  version: v1
  content_hash: 8c6c542fb98144e825512c0ef1bd4e4ec8d5f472a96cd27f291f274b35e23a4f
  kind: check
  description: Check that panels showing replicated quantitative data report how many
    replicates were used and what they represent. Use this for the replication-reporting
    quality-control check. Decides, for each panel, whether replicates apply, extracts
    the n-number and replicate type verbatim from the figure and legend, and gives
    a PASS or FAIL verdict.
  calls:
  - classify-plot-panels
  - identify-panels
  produces:
  - replication-reporting
- name: single-channel-for-overlay
  version: v1
  content_hash: 6ff1ae841c1a3c16cdec8b4cf19600c60de296f344968b71cf38bdef09330721
  kind: check
  description: Check that multicolour fluorescence overlay micrographs are accompanied
    by the corresponding single-channel images. Use this for the single-channel-for-overlay
    quality-control check. Decides, for each panel, whether a merged multi-channel
    microscopy image is present, counts the channels merged into it and the separate
    single-channel images shown beside it, and judges whether every channel is also
    shown on its own.
  calls:
  - identify-panels
  produces:
  - single-channel-for-overlay
- name: stat-significance-level
  version: v1
  content_hash: 8358b5c019616ddef130ba57b2e92d86922ef579cef7eff59d5a63699ffd8ba3
  kind: check
  description: Check that significance symbols drawn on a plot — asterisks, hashes,
    letters — are defined in the caption with the p-value thresholds they stand for.
    Use this for the stat-significance-level quality-control check. Decides, for each
    panel, which symbols appear, whether each is defined, extracts those definitions,
    and gives a PASS or FAIL verdict.
  calls:
  - classify-plot-panels
  - identify-panels
  produces:
  - stat-significance-level
- name: stat-test
  version: v1
  content_hash: eac0d3c9bfb42fc7ed822cd767172e1e6efdf4b7d4bc9c0aefbbc20113564071
  kind: check
  description: Check that figures claiming statistical significance say which statistical
    test produced it. Use this for the stat-test quality-control check. Decides, for
