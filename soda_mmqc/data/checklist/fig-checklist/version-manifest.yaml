# Pinned skill versions for fig-checklist, the production checklist.
#
# Every skill in the checklist must appear here. A run assembles one
# version per skill; the agent never sees the alternatives.
#
# 2026-10-12: the configuration the experiments settled on (exp-04 to exp-08,
# thinking/experiments/) is production -- check-major A|B <- C_i <- D: one
# entry skill, do-fig-checklist-cm, invokes the eleven checks with the `Skill`
# tool in one session per figure; each check invokes classify-panels, which
# lists and classifies the panels. The versions are fig-checklist-exp07's,
# copied as each skill's next version here:
#
#   do-fig-checklist-cm v1 <- exp07 v2      classify-panels v1 <- exp07 v1
#   identify-panels v2     <- exp07 v1      error-bars-defined v2 <- exp07 v4
#   individual-data-points v2 <- exp07 v5   micrograph-scale-bar v2 <- exp07 v4
#   the other eight checks v2 <- exp07 v2
#
# The v1 checks, identify-panels v1 and classify-plot-panels -- the skills of
# per-check runs before the experiments -- stay, unpinned or unreached.
# A single check still runs on its own: it invokes classify-panels itself.
#
# 2026-10-22, exp-10: production answers **panel-major**, decided with the
# author -- one row per panel, `panel_label` and the unscored `panel_classes`
# once, each check's fields under its name. Check-major was non-inferior; the
# shapes were level on accuracy, panel-major a little ahead on dispatch and
# cost, and it states each panel once. do-fig-checklist-pm v1 is
# do-fig-checklist-cm v1 under another name. The check-major entry point stays
# pinned, for runs that compare with the earlier ones.
#
# Each entry point owns one contract, derived from the checks' own and
# verified against them (experiments/exp-10-panel-major-revisited/
# build_contract.py --target fig-checklist), and a merged gold (gold-v7).
checklist: fig-checklist

skills:
  # Entry points: the whole checklist in one session. Production: -pm.
  do-fig-checklist-cm: v1
  do-fig-checklist-pm: v1

  # Shared skills. classify-panels is invoked by every check;
  # identify-panels and classify-plot-panels are reached by no pinned skill.
  classify-panels: v1
  classify-plot-panels: v1
  identify-panels: v2

  # Checks. Each owns schema.json, eval-manifest.json and benchmark.json,
  # which stay above the version directories so two versions of one skill
  # score against the same contract and stay comparable.
  error-bars-defined: v2
  image-annotation-defined: v2
  individual-data-points: v2
  micrograph-scale-bar: v2
  panel-image-matches-caption: v2
  plot-axis-units: v2
  plot-gap-labeling: v2
  replication-reporting: v2
  single-channel-for-overlay: v2
  stat-significance-level: v2
  stat-test: v2
