# Defaults for an agentic run of `fig-checklist`.
#
# Provider-neutral: the file names which model each runtime should use
# without taking a side on which runtime is used. `--model` still wins.
#
# Nothing here may touch the permission profile — no allowed_tools, no
# permission_mode, no setting_sources, no cwd, no skills. That boundary is a
# property of the sealed runtime, not of a checklist, and the loader refuses
# the file outright rather than warning about it in a log nobody reads.

models:
  # The Milestone 5 deltas were measured on this model. Changing it
  # invalidates the comparison in 2026-09-15-milestone-5-results.md.
  openai: gpt-5-mini

  # Sonnet 5.5, named exactly: exp-07 (2026-10-12) found it level with Opus
  # 5.5 on the checklist, ahead where they differ, at under half the cost;
  # a bare alias would move with the next Sonnet and the comparison with it.
  claude-sdk: claude-sonnet-5-5

session:
  # Turn ceiling for one example: a guard against a looping session, not a
  # budget. The whole checklist in one session takes 25-30 turns (exp-07:
  # at most 30, and more than 24 in nine sessions in ten), so the earlier 24
  # -- set for single checks -- would cut nearly every session short.
  max_turns: 40
