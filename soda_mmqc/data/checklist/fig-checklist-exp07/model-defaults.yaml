# Defaults for an agentic run of `fig-checklist-exp07`.
#
# The model is exp-07's variable and is set by the runner, so no `models`
# here. Nothing here may touch the permission profile (see
# fig-checklist/model-defaults.yaml).

session:
  # Summarized thinking in the transcript (decided with the author,
  # 2026-10-12): the default left every thinking block empty, so a session's
  # reasoning could not be read. Adaptive is the models' default type; only
  # the display changes.
  thinking:
    type: adaptive
    display: summarized
